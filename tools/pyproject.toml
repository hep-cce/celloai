[project]
name = "celloai-tools"
version = "0.1.0"
description = "MCP tools and retrieval pipeline for CelloAI"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "fastmcp>=4.0.5,<5",
    "httpx>=0.28.1,<1",

    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",

    "langchain==0.3.23",
    "langchain-chroma==0.2.2",
    "langchain-community==0.3.21",
    "langchain-core==0.3.51",
    "langchain-huggingface==0.1.2",
    "langchain-text-splitters==0.3.8",

    "chromadb==0.5.0",
    "sentence-transformers==2.7.0",
    "transformers==4.57.1",
    "huggingface-hub==0.34.3",

    "click==8.3.0",
    "tree-sitter==0.20.4",
    "tree-sitter-languages==1.10.2",

    "markdown==3.8",
    "unstructured==0.16.5",
    "docx2txt==0.8",
    "pdfminer-six==20231228",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
